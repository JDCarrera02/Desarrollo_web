<!DOCTYPE html>
<html lang="en">
<head>

<body>

    <script>

        // Declarar variable que guardará el numero del mes que ingrese el usuario
        let entradaMes

        do {
            // Pedir mes al usuario    
            entradaMes = Number(prompt('Ingresa un mes (en numero) por ejemplo 2 = \'febrero\' o 10 = \'octubre\''))
            
            // Comprobar rango, ni que sea 0 ni un numero negativo, y que no sea mayor a 12 ya que no existe un mes '13' ni '14'
            if (entradaMes <= 0 || entradaMes > 12) {
                alert('No es un mes valido, el numero ingresado debe ser mayor a 0 y menor o igual que 12')
            } else {
                // Si s encuentra en el rango valido
                break // Romper y salir del bucle
            }

        } while (true);
        
        // Flag de prueba
        console.log(entradaMes)

        // Array doble indexado
        const festivos = [[1,6], [], [], [17, 18, 23], [1], [], [], [15], [], [12], [1], [6, 8, 25]]

        // Array de los dias
        const diasSemana = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes", "Sabado", "Domingo"]
        
        const anioCalendario = 2026

        // ¿Qué dia empieza el mes seleccionado por el usuario?
        const empieza = new Date(anioCalendario, entradaMes-1)
        
        // FLag para comprobar si estamos bien
        console.log(`El mes: ${mes} y el dia ${empieza}`)

        // Ir al indice del mes en el array doble indexado
        const posicion = festivos[mes]

        // Para imprimir los numeros (de los dias)
        let dias = 1 // Empezamos por el dia 1

        // Apartado de escritura del calendario

        // Escribir los dias de la semana
        for (let i = 0; i < diasSemana.length; i++) {
            
            // Encabezado Nombres de los dias de la semana
            document.write("<tr>")
            document.write("<td>"+diasSemana[i]+"</td>")
            document.write("<td>"+"   "+"</td>")

            // Comprobar si la posicion tiene mas de un elemento para recorrerlo, si no, solamente se imprime el elemento existente

            if (posicion.length >= 1){ // Si tiene uno o mas elementos

                // --------------------- Hasta aca voy

                // Elemento tr
                document.write("<tr>")

                for (let j = 0; j < posicion.length; j++) {
                    document.write()
                }

                document.write("</tr>")

            } else {
                // Si no tiene elementos, no se imprime el festivo
            }
            

            document.write("</tr>")
        }
        
        
             
    </script>
