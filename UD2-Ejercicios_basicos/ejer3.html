<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <table>
        <script>

            document.write("<tr>")

            for (let i = 1; i < 11; i++) {
                document.write('Tabla del '+i+"     ")
            }

            document.write("</tr>")

                for(i = 1; i<11;i++){

                    document.write("<tr>")

                    for(j=1;j<11;j++){
                    document.write("<td>", i,' * ',j,' = ',(j*i),"  ","</td>")
                    }
                }

        </script>

    </table>
</body>
</html>
