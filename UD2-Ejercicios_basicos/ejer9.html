<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Crear el arreglo con los nombres
        let listaNombres = ["C3PO", "R2", "Vader", "luck"]

        // Pedir al usuario el nombre del personaje
        let entrada = prompt("Ingresa el nombre de un personaje:")

        // Para salir del bucle si hay alguna coincidencia
        let encontrado = false
        
        // Comprobar que la entrada del usuario coincida por lo menos con alguno de los que hay guardados en la lista
        for (let i = 0; i < listaNombres.length; i++) {
           if (entrada.toLowerCase() === listaNombres[i].toLowerCase()) {
                encontrado = true
           } 
        }

        // Comprobar si la variable ha cambiado (si encontro alguna coincidencia)
        if (encontrado) {
            alert('Es un personaje de Star Wars')
        } else {
            alert('No es un personaje de Star Wars')
        }
    </script>
</body>
</html>
