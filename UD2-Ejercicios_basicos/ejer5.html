<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        let num1 = (prompt('Introduce un numero: '))
        let num2 = (prompt('Introduce otro numero: '))

        if (esEntradaNumerica(num1) && esEntradaNumerica(num2)) {
            document.write('El mayor de los numeros introducidos: ',Math.max(num1, num2))
        } else {
            document.write('Uno o ambos de los datos introducidos no es un numero')
        }

        function esEntradaNumerica(valor) {
            if (valor.trim() === "") return false
            return !isNaN(Number(valor))
        }

    </script>
</body>
</html>
