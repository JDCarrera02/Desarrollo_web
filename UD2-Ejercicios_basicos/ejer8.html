<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Para cambiar de tamaño cuando se necesite
        let dimension = 5
        // Doble for anidado, uno para dibujar las filas, y otro las columnas
        for (i = 1; i <= dimension; i++) {
            
            for (j = 0; j < i; j++) {
                document.write(i)   
            }

            document.write('<br>')
        }
    </script>
</body>
</html>
